<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FPV戦車ハンター</title>
<style>

#pl{left:22px}#pr{right:22px}

.pp{position:fixed;top:calc(min(44vw,260px) * -.25);width:min(44vw,260px);height:min(44vw,260px);pointer-events:none;opacity:.88}
#pa{left:calc(min(44vw,260px) * -.5)}#pb{right:calc(min(44vw,260px) * -.5)}

#mk{margin-top:26px}

#ov h1{margin:0;font-size:26px}#ov p{margin:0;font-size:13px;line-height:1.7;max-width:420px;color:#c8d8cc}
#ov button{font-size:17px;padding:12px 28px;background:var(--ac);color:#06210f;border:0;font-weight:700}
</style></head><body>
<svg class="pp" id="pa" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="rgba(20,20,20,.18)"/><g fill="#161616" stroke="#444" stroke-width="2"><ellipse cx="100" cy="48" rx="13" ry="46"/><ellipse cx="100" cy="152" rx="13" ry="46"/></g><circle cx="100" cy="100" r="13" fill="#2b2b2b" stroke="#666" stroke-width="3"/></svg>
<svg class="pp" id="pb" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="rgba(20,20,20,.18)"/><g fill="#161616" stroke="#444" stroke-width="2"><ellipse cx="100" cy="48" rx="13" ry="46"/><ellipse cx="100" cy="152" rx="13" ry="46"/></g><circle cx="100" cy="100" r="13" fill="#2b2b2b" stroke="#666" stroke-width="3"/></svg>
<svg id="ch" viewBox="0 0 40 40"><path d="M20 3v9M20 28v9M3 20h9M28 20h9" stroke="#7dffb0" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="20" cy="20" r="1.8" fill="#7dffb0"/></svg>
<pre id="osd"></pre>
<div id="bt"><button id="sn">音</button><button id="md">アングル</button><button id="rs">リセット</button></div>
<button id="bm">爆破</button>
<div id="mk"></div>
<div class="pad" id="pl"><div class="kn" id="kl"></div></div>
<div class="pad" id="pr"><div class="kn" id="kr"></div></div>
<div id="cr">爆発</div>
<div id="ov"><h1 id="oh">FPV戦車ハンター</h1>
<p id="op">道路を通り過ぎる戦車と、壁の陰に隠れた兵士を探して突っ込もう。接触か爆破ボタンで爆発し、周囲7mの敵を倒します。残機は6機で、敵を1体倒すごとに1機回復します（最大9機）。横向き推奨。<br>
左スティック：上下=スロットル（位置を保持）、左右=ヨー<br>右スティック：前後=ピッチ、左右=ロール<br>
キーボード：W/S=スロットル A/D=ヨー 矢印=ピッチ/ロール Space=爆破 R=リセット M=モード切替<br>
アングル=自動水平、アクロ=本物のFPV操作</p>
<button id="go">スタート</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),cl=(v,a=-1,b=1)=>Math.max(a,Math.min(b,v));
const rd=new T.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(rd.domElement);
const sc=new T.Scene();sc.background=new T.Color(0x9cc9f0);sc.fog=new T.Fog(0x9cc9f0,80,700);
const cam=new T.PerspectiveCamera(90,1,.3,1000);
sc.add(new T.HemisphereLight(0xffffff,0x446644,.9));const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(50,100,30);sc.add(dl);
const gc=document.createElement('canvas');gc.width=gc.height=128;const gx=gc.getContext('2d');gx.fillStyle='#4a7a43';gx.fillRect(0,0,128,128);gx.fillStyle='#3d6a38';gx.fillRect(0,0,128,3);gx.fillRect(0,0,3,128);
const gt=new T.CanvasTexture(gc);gt.wrapS=gt.wrapT=T.RepeatWrapping;gt.repeat.set(800,800);gt.anisotropy=rd.capabilities.getMaxAnisotropy();
const gnd=new T.Mesh(new T.PlaneGeometry(4000,4000),new T.MeshLambertMaterial({map:gt}));gnd.rotation.x=-Math.PI/2;sc.add(gnd);
const pad0=new T.Mesh(new T.CylinderGeometry(3,3,.06,24),new T.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4}));pad0.position.y=.04;sc.add(pad0);
// 戦場
const bx=(w,h,d,c)=>new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshLambertMaterial({color:c}));
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const road=[-40,-95],C=[],tanks=[],sold=[],fx=[],deb=[];
road.forEach(z=>{const m=bx(500,.05,9,0x4a4a4e);m.material.polygonOffset=true;m.material.polygonOffsetFactor=-2;m.material.polygonOffsetUnits=-2;m.position.set(0,.04,z);sc.add(m)});
for(let i=0;i<9;i++){let x,z;do{x=(rnd()-.5)*220;z=-10-rnd()*150}while(Math.abs(z+40)<9||Math.abs(z+95)<9||Math.hypot(x,z)<15);
 const w=6+rnd()*8,h=4+rnd()*8,d=6+rnd()*6,m=bx(w,h,d,i%2?0x8c8576:0x9a7b5c);m.position.set(x,h/2,z);sc.add(m);C.push({x,z,hx:w/2+.3,hz:d/2+.3,h})}
for(let i=0;i<3;i++){const g=new T.Group(),a=bx(4.4,1.1,2.4,0x55603a),t=bx(2.2,.8,1.5,0x4a5532),b=bx(2.6,.25,.25,0x2a2a2a);
 a.position.y=.8;t.position.y=1.65;b.position.set(2,1.7,0);g.add(a,t,b);sc.add(g);
 tanks.push({g,z:road[i%2],dir:i%2?-1:1,x:0,alive:0,wait:0,v:5+rnd()*4})}
for(let i=0;i<10;i++){const g=new T.Group(),a=bx(.5,.9,.35,0x6b7a3c),h=bx(.3,.3,.3,0xe0b48a),k=bx(.36,.14,.36,0x3d4a22);
 a.position.y=.55;h.position.y=1.15;k.position.y=1.37;g.add(a,h,k);sc.add(g);
 const w=bx(3,1.7,.5,i%2?0x777777:0x6e5a3e),cv={x:0,z:0,hx:1.8,hz:.55,h:1.7};sc.add(w);C.push(cv);sold.push({g,w,cv,x:0,z:0,alive:0,wait:0})}
function addDeb(m,p,v,w,h,life){m.position.copy(p);sc.add(m);deb.push({m,v,w,h,life,t:0})}
const rv=(a)=>(rnd()-.5)*a;
function flyTank(k){const dr=new T.Vector3(k.x-pos.x,0,k.z-pos.z).normalize(),tu=new T.Group(),b=bx(2.6,.25,.25,0x2a2a2a);
 b.position.set(2,.05,0);tu.add(bx(2.2,.8,1.5,0x4a5532),b);
 addDeb(tu,new T.Vector3(k.x,1.7,k.z),new T.Vector3(dr.x*6+rv(6),16+rnd()*6,dr.z*6+rv(6)),new T.Vector3(rv(12),rv(12),rv(12)),.4,6);
 const h=bx(4.4,.9,2.4,0x1c1c1c);h.rotation.y=k.dir>0?0:Math.PI;addDeb(h,new T.Vector3(k.x,.6,k.z),new T.Vector3(),new T.Vector3(),.45,5)}
function flySold(o){const dr=new T.Vector3(o.x-pos.x,0,o.z-pos.z).normalize(),g=new T.Group(),a=bx(.5,.9,.35,0x6b7a3c),h=bx(.3,.3,.3,0xe0b48a),k=bx(.36,.14,.36,0x3d4a22);
 a.position.y=-.2;h.position.y=.4;k.position.y=.62;g.add(a,h,k);
 addDeb(g,new T.Vector3(o.x,.8,o.z),new T.Vector3(dr.x*8+rv(4),13+rnd()*5,dr.z*8+rv(4)),new T.Vector3(rv(16),rv(8),rv(16)),.3,3.5)}
function spawnSold(o){let z;do{z=-15-rnd()*140}while(Math.abs(z+40)<8||Math.abs(z+95)<8);const x=(rnd()-.5)*170;
 o.x=x;o.z=z;o.g.position.set(x,0,z);o.w.position.set(x,.85,z+1.1);o.cv.x=x;o.cv.z=z+1.1;o.g.visible=true;o.alive=1}
function boom(p,r){const m=new T.Mesh(new T.SphereGeometry(1,12,8),new T.MeshBasicMaterial({color:0xffa030,transparent:true,opacity:.9}));m.position.copy(p);sc.add(m);fx.push({m,t:0,r})}
// 状態
const pos=new T.Vector3(),vel=new T.Vector3(),prev=new T.Vector3(),q=new T.Quaternion(),Y=new T.Vector3(0,1,0),X=new T.Vector3(1,0,0),Z=new T.Vector3(0,0,1);
const f=new T.Vector3(),up=new T.Vector3(),ac=new T.Vector3(),d=new T.Vector3(),qa=new T.Quaternion(),qb=new T.Quaternion(),qc=new T.Quaternion(),dq=new T.Quaternion(),eu=new T.Euler(),qt=new T.Quaternion().setFromAxisAngle(X,.44);
let thr=.33,score=0,lives=6,tk=0,sk=0,crash=0,angle=true,run=false,over=false,wantBlast=false,tYaw=0,tRoll=0,tPit=0;const kk={};
function place(){pos.set(0,1.5,0);prev.copy(pos);vel.set(0,0,0);q.setFromAxisAngle(Y,0);thr=.33}
function full(){deb.forEach(e=>sc.remove(e.m));deb.length=0;score=0;lives=6;tk=0;sk=0;crash=0;over=false;wantBlast=false;$('cr').style.display='none';place();
 sold.forEach(spawnSold);tanks.forEach(k=>{k.alive=1;k.g.visible=true;k.x=(rnd()-.5)*260;k.g.position.set(k.x,0,k.z);k.g.rotation.y=k.dir>0?0:Math.PI})}
const near=(x,z)=>Math.hypot(x-pos.x,pos.y-1,z-pos.z)<7.5;
function explode(){let kills=0;boom(pos,7);
 tanks.forEach(k=>{if(k.alive&&near(k.x,k.z)){k.alive=0;k.g.visible=false;k.wait=4;score+=100;tk++;kills++;flyTank(k);boom(k.g.position,3)}});
 sold.forEach(o=>{if(o.alive&&near(o.x,o.z)){o.alive=0;o.g.visible=false;o.wait=4;score+=50;sk++;kills++;flySold(o)}});
 boomSnd(kills);lives=Math.min(9,lives-1+kills);crash=.9;$('cr').style.display='flex'}
function world(dt){
 tanks.forEach(k=>{if(k.alive){k.x+=k.dir*k.v*dt;if(Math.abs(k.x)>140)k.x=-130*k.dir;k.g.position.set(k.x,0,k.z);k.g.rotation.y=k.dir>0?0:Math.PI}
  else if((k.wait-=dt)<=0){k.alive=1;k.g.visible=true;k.x=-130*k.dir}});
 sold.forEach(o=>{if(!o.alive&&(o.wait-=dt)<=0)spawnSold(o)});
 for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.t+=dt;const u=e.t/.6;e.m.scale.setScalar(1+u*e.r);e.m.material.opacity=.9*(1-u);if(u>=1){sc.remove(e.m);fx.splice(i,1)}}
 for(let i=deb.length-1;i>=0;i--){const e=deb[i];e.t+=dt;if(e.t>e.life){sc.remove(e.m);deb.splice(i,1);continue}
  const p=e.m.position;e.v.y-=9.8*dt;p.addScaledVector(e.v,dt);
  if(p.y<e.h){p.y=e.h;e.v.set(0,0,0);e.w.set(0,0,0)}else{e.m.rotation.x+=e.w.x*dt;e.m.rotation.y+=e.w.y*dt;e.m.rotation.z+=e.w.z*dt}}}
function finish(){over=true;run=false;$('oh').textContent='ゲームオーバー';$('op').textContent=`スコア ${score}（戦車 ${tk}両、兵士 ${sk}人）`;$('go').textContent='もう一度';$('ov').style.display='flex'}
const ex=v=>v*(.35+.65*v*v);
function step(dt){world(dt);
 if(crash>0){wantBlast=false;crash-=dt;if(crash<=0){$('cr').style.display='none';if(lives<=0)finish();else place()}return}
 let yK=(kk.KeyD?1:0)-(kk.KeyA?1:0),pK=(kk.ArrowUp?1:0)-(kk.ArrowDown?1:0),rK=(kk.ArrowRight?1:0)-(kk.ArrowLeft?1:0),yG=0,pG=0,rG=0;
 thr=cl(thr+((kk.KeyW?1:0)-(kk.KeyS?1:0))*.5*dt,0,1);
 const gp=navigator.getGamepads&&[...navigator.getGamepads()].find(x=>x);
 if(gp){const z=v=>Math.abs(v)<.08?0:v;yG=z(gp.axes[0]);thr=cl((1-gp.axes[1])/2,0,1);rG=z(gp.axes[2]);pG=-z(gp.axes[3])}
 const yaw=ex(cl(tYaw+yK+yG)),pit=ex(cl(tPit+pK+pG)),rol=ex(cl(tRoll+rK+rG));
 if(angle){f.set(0,0,-1).applyQuaternion(q);const h=Math.atan2(-f.x,-f.z)-yaw*2.4*dt;
  qa.setFromAxisAngle(Y,h);qb.setFromAxisAngle(X,-pit*.75);qc.setFromAxisAngle(Z,-rol*.75);qa.multiply(qb).multiply(qc);q.slerp(qa,1-Math.exp(-10*dt))}
 else{eu.set(-pit*5.5*dt,-yaw*3*dt,-rol*5.5*dt,'XYZ');dq.setFromEuler(eu);q.multiply(dq)}
 q.normalize();
 up.set(0,1,0).applyQuaternion(q);ac.copy(up).multiplyScalar(thr*30);ac.y-=9.81;
 ac.addScaledVector(vel,-.25-.004*vel.length());
 vel.addScaledVector(ac,dt);prev.copy(pos);pos.addScaledVector(vel,dt);
 let hit=false;
 if(pos.y<.12){if(vel.y<-9||(up.y<.2&&vel.length()>6))hit=true;pos.y=.12;if(vel.y<0)vel.y=0;const k=Math.max(0,1-6*dt);vel.x*=k;vel.z*=k}
 for(const c of C)if(pos.y<c.h&&Math.abs(pos.x-c.x)<c.hx&&Math.abs(pos.z-c.z)<c.hz)hit=true;
 for(const k of tanks)if(k.alive&&Math.abs(pos.x-k.x)<2.6&&Math.abs(pos.z-k.z)<1.6&&pos.y<2.3)hit=true;
 for(const o of sold)if(o.alive&&Math.hypot(pos.x-o.x,pos.z-o.z)<1&&pos.y<2)hit=true;
 if(hit||wantBlast){wantBlast=false;explode()}
}
// 入力UI
const R0=60;
function mkPad(el,cb){let id=null;const mv=e=>{const b=el.getBoundingClientRect();let x=(e.clientX-b.left-b.width/2)/R0,y=-(e.clientY-b.top-b.height/2)/R0;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}cb(x,y,1)};
el.onpointerdown=e=>{id=e.pointerId;el.setPointerCapture(id);mv(e)};el.onpointermove=e=>{if(e.pointerId===id)mv(e)};
const up=e=>{if(e.pointerId===id){id=null;cb(0,0,0)}};el.onpointerup=up;el.onpointercancel=up}
mkPad($('pl'),(x,y,a)=>{tYaw=a?x:0;if(a)thr=(y+1)/2});
mkPad($('pr'),(x,y)=>{tRoll=x;tPit=y});
addEventListener('keydown',e=>{kk[e.code]=1;if(e.code==='KeyR')full();if(e.code==='Space')wantBlast=true;if(e.code==='KeyM')tgl()});addEventListener('keyup',e=>kk[e.code]=0);
function tgl(){angle=!angle;$('md').textContent=angle?'アングル':'アクロ'}
$('md').onclick=tgl;$('rs').onclick=full;$('go').onclick=()=>{$('ov').style.display='none';if(over)full();run=true;initAudio();if(AC&&AC.state!=='running')AC.resume()};$('sn').onclick=()=>{muted=!muted;$('sn').textContent=muted?'無音':'音'};$('bm').onclick=()=>{wantBlast=true};
function rs(){const w=innerWidth,h=innerHeight;rd.setSize(w,h);cam.aspect=w/h;cam.fov=cl(2*Math.atan(Math.tan(55*Math.PI/180)/cam.aspect)*180/Math.PI,60,100);cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();full();
// 音（Web Audioで合成）
let AC=null,mst,dg,dn=[],tnk=[],muted=false;const ar=new T.Vector3();
function initAudio(){if(AC)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();
 mst=AC.createGain();mst.gain.value=0;mst.connect(AC.destination);
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;dg=AC.createGain();dg.gain.value=0;lp.connect(dg);dg.connect(mst);
 dn=[-1,0,1].map(i=>{const o=AC.createOscillator();o.type='sawtooth';o.detune.value=i*18;o.connect(lp);o.start();return o});
 tnk=tanks.map((k,i)=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=60+i*5;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=450;
  const tr=AC.createGain();tr.gain.value=.65;const l=AC.createOscillator();l.frequency.value=9+i*1.5;const lg=AC.createGain();lg.gain.value=.35;l.connect(lg);lg.connect(tr.gain);

  o.connect(f);f.connect(tr);tr.connect(v);if(p){v.connect(p);p.connect(mst)}else v.connect(mst);o.start();l.start();return{v,p}})}
function boomSnd(k){if(!AC||muted)return;const t=AC.currentTime,len=1.2,n=AC.sampleRate*len|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);

 const sr=AC.createBufferSource();sr.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(120,t+len);

 const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(35,t+.6);

function audio(){if(!AC)return;const t=AC.currentTime,act=run&&crash<=0;
 mst.gain.setTargetAtTime(run&&!muted?1:0,t,.1);
 dn.forEach(o=>o.frequency.setTargetAtTime(160+thr*480+vel.length()*2,t,.05));
 dg.gain.setTargetAtTime(act?.03+thr*.05:0,t,.08);
 ar.set(1,0,0).applyQuaternion(cam.quaternion);
 tanks.forEach((k,i)=>{const n=tnk[i],dx=k.x-pos.x,dz=k.z-pos.z,d=Math.hypot(dx,dz);
  n.v.gain.setTargetAtTime(k.alive?.5*Math.pow(Math.max(0,1-d/150),2):0,t,.1);
  if(n.p)n.p.pan.setTargetAtTime(cl((dx*ar.x+dz*ar.z)/Math.max(d,1)),t,.1)})}
// 描画
let pr=0,pt=performance.now();
function draw(){
 const nw=performance.now(),pd=Math.min((nw-pt)/1000,.05);pt=nw;pr+=((run&&crash<=0)?.8+thr*3.2:.4)*360*pd;
 $('pa').style.transform=`perspective(500px) rotateX(72deg) rotate(${pr}deg)`;$('pb').style.transform=`perspective(500px) rotateX(72deg) rotate(${-pr}deg)`;
